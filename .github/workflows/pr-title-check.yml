name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Linear ticket ID
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qP '[A-Z]+-\d+'; then
            echo "PR title contains a Linear ticket ID."
          else
            echo "::warning::PR title should contain a Linear ticket ID (e.g., ENG-123)"
            exit 1
          fi
